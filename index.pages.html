<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Бойцовский клуб Dota 2</title>
    <script>
      const route = new URLSearchParams(location.search).get("__route");
      if (route && route.startsWith("/") && !route.startsWith("//")) {
        history.replaceState(null, "", "%BASE_URL%".replace(/\/$/, "") + route);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.static.tsx"></script>
  </body>
</html>
